server {
    listen 80;
    server_name _;

    # Increase timeout for SSE streaming (agent can take 2-5 min)
    proxy_read_timeout     300s;
    proxy_connect_timeout  60s;
    proxy_send_timeout     300s;

    # Backend API + SSE
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Required for SSE streaming
        proxy_set_header   Connection          "";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        # Disable buffering for SSE
        proxy_buffering    off;
        proxy_cache        off;

        # CORS headers
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # Static frontend files (served by Amplify in prod)
    # Uncomment below to serve locally built frontend from EC2
    # location / {
    #     root   /home/ubuntu/fundready-ai/frontend/dist;
    #     index  index.html;
    #     try_files $uri $uri/ /index.html;
    # }
}
